name: Python CI

# Step 1: When should this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Step 2: What should it do?
jobs:
  build:
    runs-on: ubuntu-latest  # Tells GitHub to give a fresh Linux machine

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # "downloads" repo onto the Linux machine

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8  # A tool to check for code errors
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

# If the build passes, we can deploy to Hugging Face Spaces
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessary for history management

    - name: Deploy to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        
        mkdir ../temp  # Create a temporary directory to stage files 
        
        cp ui/infer_rating_agent.py ../temp/app.py
        cp requirements.txt ../temp/
        cp README.md ../temp/
        cp -r ui/ ../temp/ui/
        
        # 3. Initialize a FRESH Git repo in the briefcase (wipes large file history)
        cd ../temp
        git init -b main
        
        # 4. Configure the "Robot" identity
        git config user.name github-actions
        git config user.email github-actions@github.com
        
        # 5. Pack and Commit
        git add .
        git commit -m "Automated deployment from GitHub Actions"
        
        # 6. Force push to the NEW Space URL
        git push --force https://rukshan1015:$HF_TOKEN@huggingface.co/spaces/rukshan1015/drug_review main

  
  