name: Python CI

# Step 1: When should this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Step 2: What should it do?
jobs:
  build:
    runs-on: ubuntu-latest  # This tells GitHub to give you a fresh Linux machine

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # This "downloads" your repo onto the Linux machine

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8  # A tool to check for code errors
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics